# Publishes the app's JavaScript to EAS Update on every push to every branch,
# to the EAS branch of the same name, so the newest build of any branch can be
# opened in Expo Go (or a development build) from the project's Updates page on
# expo.dev, with a QR code, without a computer.
# Run it by hand with the Expo connector: workflow_run, file
# publish-preview-update.yml, git ref any branch.
name: Publish preview update

on:
  push:
    branches: ['**']

jobs:
  publish_preview_update:
    name: Publish preview update
    type: update
    params:
      branch: ${{ github.ref_name || 'main' }}
