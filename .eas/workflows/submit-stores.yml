# Manual only: builds the production app for Android (app bundle) and iOS and
# submits them to Google Play (internal track, draft) and App Store Connect.
# No automatic trigger. Run it from the repo root after the owner has filled
# submit.production.ios in eas.json (ascAppId, appleTeamId):
#
#   npx eas-cli workflow:run .eas/workflows/submit-stores.yml
name: Submit to stores

jobs:
  build_android:
    name: Build Android production
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Google Play
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  build_ios:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
