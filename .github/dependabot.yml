version: 2
# Pull requests target the default branch.
#
# Majors are not proposed here: a major upgrade is planned work with its own
# issue. Security fixes for a major still arrive as security updates.
#
# No `labels:` on purpose: a label that does not exist makes Dependabot report
# an error on every run.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # Wait a week before proposing a newly published version: new releases can
    # be malicious or unstable (the scan job's dependabot-missing-cooldown rule).
    cooldown:
      default-days: 7
    groups:
      # Expo packages move together. Their versions are pinned to the SDK, so
      # only patch updates inside the pinned range are proposed; an SDK upgrade
      # is planned work (`npx expo install --fix`).
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
        update-types:
          - "patch"
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # React and React Native are pinned to the SDK as well.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Until Astro and typescript-eslint support TS 7; remove then.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    # Wait a week before proposing a newly published version: new releases can
    # be malicious or unstable (the scan job's dependabot-missing-cooldown rule).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
